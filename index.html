<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Мемы для Эмиля 💜⚽</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
  html,body{height:100%;overflow:hidden;font-family:-apple-system,'Helvetica Neue',sans-serif;background:#000;color:#fff;touch-action:manipulation;}
  .bg{position:fixed;inset:0;background:radial-gradient(ellipse at 20% 20%,#2a0044 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,#5c0080 0%,transparent 45%),#000;z-index:0;}
  .petals{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden;}
  .petal{position:absolute;top:-40px;font-size:16px;opacity:.85;animation:petalFall linear infinite;}
  @keyframes petalFall{0%{transform:translateY(0) rotate(0);opacity:0;}10%{opacity:.9;}100%{transform:translateY(110vh) rotate(360deg);opacity:0;}}

  .header{position:fixed;top:0;left:0;right:0;z-index:20;padding:12px;padding-top:max(12px,env(safe-area-inset-top));text-align:center;background:linear-gradient(180deg,rgba(0,0,0,.95),rgba(0,0,0,0));}
  .badge{display:inline-block;padding:4px 12px;background:rgba(255,110,196,.15);border:1px solid rgba(255,110,196,.5);border-radius:100px;color:#ffb7dc;font-size:.6rem;letter-spacing:3px;font-weight:800;margin-bottom:4px;}
  .title{font-size:clamp(1.5rem,6vw,2rem);font-weight:900;line-height:1;background:linear-gradient(120deg,#fff 10%,#ff6ec4 40%,#b76bff 70%,#fff);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 4s linear infinite;filter:drop-shadow(0 0 25px rgba(255,110,196,.6));}
  @keyframes shine{to{background-position:200% center;}}
  .sub{color:#ffb7dc;font-size:.62rem;letter-spacing:4px;font-weight:800;margin-top:2px;}

  .menu{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:14px;right:14px;z-index:30;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;max-width:450px;margin:0 auto;}
  .menu-btn{padding:14px 8px;border-radius:16px;background:linear-gradient(135deg,rgba(255,110,196,.15),rgba(183,107,255,.15));border:1.5px solid rgba(255,110,196,.5);color:#fff;font-family:inherit;font-size:.7rem;font-weight:900;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;letter-spacing:1px;text-transform:uppercase;transition:all .2s;}
  .menu-btn .ico{font-size:1.5rem;filter:drop-shadow(0 0 10px rgba(255,110,196,.7));}
  .menu-btn:active{transform:scale(.95);background:linear-gradient(135deg,#ff6ec4,#b76bff);box-shadow:0 0 30px rgba(255,110,196,.7);}

  .screen{position:fixed;inset:0;z-index:50;display:none;background:linear-gradient(180deg,#000,#1a0022);padding:14px;padding-top:max(14px,env(safe-area-inset-top));padding-bottom:120px;flex-direction:column;}
  .screen.on{display:flex;animation:screenIn .3s;}
  @keyframes screenIn{from{opacity:0;transform:scale(.97);}to{opacity:1;transform:scale(1);}}
  .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-shrink:0;}
  .top-bar .title2{color:#ffb7dc;font-size:.8rem;letter-spacing:3px;text-transform:uppercase;font-weight:900;}
  .close-x{width:42px;height:42px;border-radius:50%;background:rgba(255,110,196,.15);border:1.5px solid rgba(255,110,196,.5);color:#ffb7dc;font-size:1.2rem;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;}
  .close-x:active{transform:scale(.9);}

  .meme-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow-y:auto;}
  .meme-card{background:#000;border:3px solid rgba(255,110,196,.6);border-radius:20px;overflow:hidden;max-width:400px;width:100%;box-shadow:0 0 60px rgba(255,110,196,.5);animation:cardIn .4s cubic-bezier(0.34,1.56,0.64,1);}
  @keyframes cardIn{from{transform:scale(.85) rotate(-2deg);opacity:0;}to{transform:scale(1) rotate(0);opacity:1;}}
  .meme-img{background:linear-gradient(135deg,#1a0022,#3a0052);min-height:240px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:12px;}
  .meme-img img,.meme-img svg{max-width:100%;max-height:320px;display:block;object-fit:contain;filter:drop-shadow(0 8px 20px rgba(0,0,0,.6));}
  .meme-img svg{width:220px;height:220px;}
  .meme-img img{border-radius:12px;box-shadow:0 0 30px rgba(255,110,196,.4);}
  .meme-text{padding:14px 18px;background:linear-gradient(90deg,#fff,#ffe4f2);color:#1a0022;font-size:1rem;font-weight:900;text-align:center;line-height:1.25;font-family:Impact,'Arial Black',sans-serif;white-space:pre-line;}
  .meme-count{font-size:.72rem;color:#ffb7dc;letter-spacing:3px;font-weight:800;opacity:.8;}
  .next-btn{padding:14px 38px;background:linear-gradient(135deg,#ff6ec4,#b76bff);color:#fff;border:none;border-radius:100px;font-family:inherit;font-weight:900;font-size:.85rem;letter-spacing:2px;text-transform:uppercase;cursor:pointer;box-shadow:0 6px 0 #4b0082,0 0 30px rgba(255,110,196,.6);}
  .next-btn:active{transform:translateY(5px);box-shadow:0 1px 0 #4b0082,0 0 30px rgba(255,110,196,.6);}

  .comp-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;}
  .comp-card{background:linear-gradient(135deg,#2a0044,#5c0080);border:3px solid rgba(255,110,196,.6);border-radius:26px;padding:40px 26px;max-width:380px;width:100%;text-align:center;box-shadow:0 0 60px rgba(255,110,196,.5);min-height:270px;display:flex;flex-direction:column;justify-content:center;align-items:center;}
  .comp-icon{font-size:4.5rem;margin-bottom:16px;filter:drop-shadow(0 0 25px rgba(255,110,196,.8));animation:bounce 1.5s ease-in-out infinite;}
  @keyframes bounce{0%,100%{transform:translateY(0) rotate(-5deg);}50%{transform:translateY(-12px) rotate(5deg);}}
  .comp-text{font-size:1.15rem;font-weight:800;line-height:1.4;color:#fff;text-shadow:0 0 15px rgba(255,110,196,.5);}

  .games-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:10px 0;max-width:500px;margin:0 auto;width:100%;}
  .game-card{aspect-ratio:1;border-radius:22px;background:linear-gradient(135deg,rgba(255,110,196,.08),rgba(183,107,255,.08));border:2px solid rgba(255,110,196,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-family:inherit;color:#fff;font-weight:900;font-size:.72rem;letter-spacing:2px;text-transform:uppercase;padding:10px;transition:all .2s;}
  .game-card .ico{font-size:2.6rem;filter:drop-shadow(0 0 15px rgba(255,110,196,.7));}
  .game-card:active{transform:scale(.95);background:linear-gradient(135deg,#ff6ec4,#b76bff);box-shadow:0 0 40px rgba(255,110,196,.7);}

  .game-view{position:fixed;inset:0;z-index:60;display:none;background:linear-gradient(180deg,#000,#1a0022);padding:14px;padding-top:max(14px,env(safe-area-inset-top));flex-direction:column;}
  .game-view.on{display:flex;}

  .react-field{flex:1;border-radius:24px;background:#1a0022;border:2px solid rgba(255,110,196,.4);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;cursor:pointer;position:relative;overflow:hidden;transition:background .2s;}
  .react-field.wait{background:linear-gradient(135deg,#2a0044,#3a0052);}
  .react-field.go{background:linear-gradient(135deg,#4ade80,#22c55e);box-shadow:inset 0 0 100px rgba(255,255,255,.3);}
  .react-field.early{background:linear-gradient(135deg,#ff3b3b,#dc2626);}
  .react-title{font-size:clamp(1.6rem,7vw,2.5rem);font-weight:900;text-align:center;padding:0 20px;line-height:1.1;}
  .react-sub{font-size:.8rem;opacity:.75;letter-spacing:3px;text-transform:uppercase;font-weight:800;}

  .hud-row{display:flex;gap:10px;justify-content:center;margin-top:12px;}
  .hud{background:rgba(255,110,196,.1);border:1.5px solid rgba(255,110,196,.5);padding:9px 16px;border-radius:100px;font-weight:900;font-size:.78rem;letter-spacing:1.5px;text-transform:uppercase;color:#ffb7dc;}
  .hud b{color:#fff;margin-left:6px;font-size:.9rem;}

  .memory-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 0;max-width:500px;width:100%;margin:0 auto;align-self:center;}
  .mem-card{aspect-ratio:1;border-radius:16px;cursor:pointer;position:relative;perspective:1000px;}
  .mem-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s;border-radius:16px;}
  .mem-card.flipped .mem-inner,.mem-card.matched .mem-inner{transform:rotateY(180deg);}
  .mem-front,.mem-back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:1.7rem;}
  .mem-front{background:linear-gradient(135deg,#ff6ec4,#b76bff);border:2px solid rgba(255,255,255,.3);}
  .mem-front::after{content:'?';color:#fff;font-size:1.5rem;opacity:.8;}
  .mem-back{background:#fff;transform:rotateY(180deg);border:2px solid #ff6ec4;}
  .mem-card.matched{opacity:.6;pointer-events:none;box-shadow:0 0 30px #4ade80;}

  .ttt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:340px;width:100%;margin:0 auto;aspect-ratio:1;}
  .ttt-cell{background:rgba(255,110,196,.06);border:3px solid rgba(255,110,196,.4);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:clamp(2.5rem,12vw,4rem);font-weight:900;cursor:pointer;color:#fff;font-family:inherit;}
  .ttt-cell.x{color:#ff6ec4;text-shadow:0 0 25px #ff6ec4;border-color:#ff6ec4;}
  .ttt-cell.o{color:#b76bff;text-shadow:0 0 25px #b76bff;border-color:#b76bff;}
  .ttt-cell.win{background:linear-gradient(135deg,#4ade80,#22c55e);color:#fff;box-shadow:0 0 40px #4ade80;}
  .ttt-status{text-align:center;font-weight:900;font-size:1.05rem;margin:14px 0;min-height:32px;}

  .quiz-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:20px;padding:20px;}
  .quiz-num{font-size:.72rem;color:#ffb7dc;letter-spacing:4px;font-weight:800;}
  .quiz-q{font-size:1.15rem;font-weight:800;text-align:center;line-height:1.4;max-width:400px;}
  .quiz-answers{display:flex;flex-direction:column;gap:10px;width:100%;max-width:400px;}
  .quiz-answers button{padding:16px;background:rgba(255,110,196,.08);border:2px solid rgba(255,110,196,.4);border-radius:16px;color:#fff;font-family:inherit;font-weight:800;font-size:.95rem;cursor:pointer;}

  .final{position:fixed;inset:0;z-index:100;display:none;background:linear-gradient(135deg,#1a0022,#5c0080);align-items:center;justify-content:center;padding:20px;}
  .final.on{display:flex;}
  .final-card{background:#000;border:4px solid rgba(255,110,196,.7);border-radius:26px;padding:38px 26px;max-width:360px;width:100%;text-align:center;box-shadow:0 0 80px rgba(255,110,196,.6);}
  .final-emoji{font-size:5rem;display:block;margin-bottom:14px;animation:bounce 1.2s ease-in-out infinite;}
  .final-title{font-size:1.5rem;font-weight:900;color:#fff;margin-bottom:10px;}
  .final-title span{background:linear-gradient(120deg,#ff6ec4,#fff,#ff6ec4);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 2s linear infinite;}
  .final-text{color:#ffb7dc;font-size:.9rem;line-height:1.5;margin-top:12px;font-weight:600;}
  .final-btn{margin-top:22px;padding:14px 34px;background:linear-gradient(135deg,#ff6ec4,#b76bff);color:#fff;border:none;border-radius:100px;font-weight:900;font-size:.82rem;letter-spacing:2.5px;text-transform:uppercase;font-family:inherit;box-shadow:0 6px 0 #4b0082;}

  .spark{position:fixed;pointer-events:none;font-size:22px;z-index:90;animation:sparkOut .9s ease-out forwards;}
  @keyframes sparkOut{from{transform:translate3d(0,0,0) scale(1);opacity:1;}to{transform:translate3d(var(--dx),var(--dy),0) scale(.2);opacity:0;}}
</style>
</head>
<body>

<div class="bg"></div>
<div class="petals" id="petals"></div>

<div class="header">
  <div class="badge">✦ для эмиля ✦</div>
  <div class="title">МЕМЫ ⚽ МЕССИ ⚽ РОНАЛДУ</div>
  <div class="sub">реальные картинки</div>
</div>

<div class="screen" id="memeScreen">
  <div class="top-bar"><div class="title2">мемы</div><button class="close-x" data-close="memeScreen">✕</button></div>
  <div class="meme-wrap">
    <div class="meme-card">
      <div class="meme-img" id="memeImg"></div>
      <div class="meme-text" id="memeText"></div>
    </div>
    <button class="next-btn" id="nextMeme">Дальше →</button>
    <div class="meme-count" id="memeCount">1 / 25</div>
  </div>
</div>

<div class="screen" id="compScreen">
  <div class="top-bar"><div class="title2">комплименты</div><button class="close-x" data-close="compScreen">✕</button></div>
  <div class="comp-wrap">
    <div class="comp-card"><div class="comp-icon" id="compIcon">💜</div><div class="comp-text" id="compText"></div></div>
    <button class="next-btn" id="nextComp">Ещё 💜</button>
  </div>
</div>

<div class="screen" id="gamesScreen">
  <div class="top-bar"><div class="title2">игры</div><button class="close-x" data-close="gamesScreen">✕</button></div>
  <div class="games-grid">
    <button class="game-card" id="gameReact"><span class="ico">⚡</span><span>Реакция</span></button>
    <button class="game-card" id="gameMemory"><span class="ico">🧠</span><span>Память</span></button>
    <button class="game-card" id="gameTTT"><span class="ico">❌⭕</span><span>Крестики</span></button>
    <button class="game-card" id="gameQuiz"><span class="ico">⚽</span><span>Футбол-викторина</span></button>
  </div>
</div>

<div class="game-view" id="reactView">
  <div class="top-bar"><div class="title2">реакция ⚡</div><button class="close-x" data-close="reactView">✕</button></div>
  <div class="react-field wait" id="reactField">
    <div class="react-title" id="reactTitle">Жди ЗЕЛЁНОГО...</div>
    <div class="react-sub" id="reactSub">приготовься</div>
  </div>
  <div class="hud-row"><div class="hud">Время <b id="reactTime">—</b></div><div class="hud">Рекорд <b id="reactBest">—</b></div></div>
</div>

<div class="game-view" id="memoryView">
  <div class="top-bar"><div class="title2">память 🧠</div><button class="close-x" data-close="memoryView">✕</button></div>
  <div class="hud-row" style="margin-bottom:8px;"><div class="hud">Ходы <b id="memMoves">0</b></div><div class="hud">Пары <b id="memPairs">0/8</b></div></div>
  <div class="memory-grid" id="memoryGrid"></div>
</div>

<div class="game-view" id="tttView">
  <div class="top-bar"><div class="title2">крестики ❌⭕</div><button class="close-x" data-close="tttView">✕</button></div>
  <div class="ttt-status" id="tttStatus">Твой ход — ты ❌</div>
  <div class="ttt-grid" id="tttGrid"></div>
</div>

<div class="game-view" id="quizView">
  <div class="top-bar"><div class="title2">футбол ⚽</div><button class="close-x" data-close="quizView">✕</button></div>
  <div class="quiz-wrap">
    <div class="quiz-num">Вопрос <span id="quizNum">1</span> / 5</div>
    <div class="quiz-q" id="quizQuestion"></div>
    <div class="quiz-answers" id="quizAnswers"></div>
    <div style="font-size:.85rem;color:#ffb7dc;font-weight:800;">Очки: <span id="quizScore">0</span></div>
  </div>
</div>

<div class="final" id="finalScreen">
  <div class="final-card">
    <span class="final-emoji" id="finalEmoji">🎉</span>
    <div class="final-title">Поздравляю,<br><span>Эмиль!</span></div>
    <div class="final-text" id="finalText"></div>
    <button class="final-btn" id="finalBtn">Закрыть</button>
  </div>
</div>

<div class="menu">
  <button class="menu-btn" id="btnMemes"><span class="ico">🎭</span>Мемы</button>
  <button class="menu-btn" id="btnComp"><span class="ico">💜</span>Комплименты</button>
  <button class="menu-btn" id="btnGames"><span class="ico">🎮</span>Игры</button>
</div>

<script>
// ==========================================
// НАРИСОВАННЫЕ ПЕРСОНАЖИ (SVG) — работают всегда
// ==========================================
const ART = {
  // РОНАЛДУ — поза Siù

    <ellipse cx="50" cy="22" rx="3" ry="2.5" fill="#8a1a15" stroke="#5a0a08"/>

    <circle cx="46" cy="14" r=".8" fill="#fff" opacity=".7"/>

    <path d="M78 15 Q82 18 78 21" stroke="#ffd93d" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  </svg>`,

  // МЕССИ с мячом
  messi: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="mJersey" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#75b8ff"/><stop offset="1" stop-color="#3a6db5"/></linearGradient>
      <linearGradient id="mSkin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5c9a5"/><stop offset="1" stop-color="#c98a5c"/></linearGradient>

let audioCtx=null,masterGain=null,audioReady=false;
function unlockAudio(){
  if(audioReady)return;
  try{
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    masterGain=audioCtx.createGain();masterGain.gain.value=.35;
    masterGain.connect(audioCtx.destination);
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    g.gain.value=.0001;o.connect(g);g.connect(masterGain);o.start(0);o.stop(.01);
    if(audioCtx.state==='suspended')audioCtx.resume();
    audioReady=true;
  }catch(e){}
}
document.addEventListener('touchstart',unlockAudio,{once:true});
document.addEventListener('click',unlockAudio,{once:true});

function note(f,start,dur,type,vol){
  if(!audioCtx||audioCtx.state!=='running')return;
  const t=audioCtx.currentTime+(start||0);
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||.15,t+.015);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(masterGain);
  o.start(t);o.stop(t+dur+.05);
}

function startMemory(){
  memMoves=0;memPairs=0;memFlipped=[];memLock=false;
  memMovesEl.textContent='0';memPairsEl.textContent='0/8';
  const deck=[...MEM_E,...MEM_E].sort(()=>Math.random()-.5);
  memoryGrid.innerHTML='';
  deck.forEach(e=>{

    c.className='mem-card';c.dataset.emoji=e;
    c.innerHTML='<div class="mem-inner"><div class="mem-front"></div><div class="mem-back">'+e+'</div></div>';
    c.addEventListener('click',()=>flipCard(c));
    memoryGrid.appendChild(c);
  });
}
function flipCard(card){
  if(memLock||card.classList.contains('flipped')||card.classList.contains('matched'))return;
  card.classList.add('flipped');memFlipped.push(card);
  note(800,0,.06,'sine',.1);
  if(memFlipped.length===2){
    memMoves++;memMovesEl.textContent=memMoves;memLock=true;
    const [a,b]=memFlipped;
    if(a.dataset.emoji===b.dataset.emoji){
      setTimeout(()=>{
        a.classList.add('matched');b.classList.add('matched');
        memPairs++;memPairsEl.textContent=memPairs+'/8';
        note(1200,0,.12,'sine',.15);
        memFlipped=[];memLock=false;
        if(memPairs===8)setTimeout(()=>showFinal('🧠','Память — супер!','Все пары за '+memMoves+' ходов! 💜'),500);
      },400);
    }else{
      setTimeout(()=>{a.classList.remove('flipped');b.classList.remove('flipped');memFlipped=[];memLock=false;},800);
    }
  }
}

const tttGrid=document.getElementById('tttGrid');
const tttStatus=document.getElementById('tttStatus');
let tttBoard=[],tttActive=false;
document.getElementById('gameTTT').addEventListener('click',()=>{
  unlockAudio();
  document.getElementById('gamesScreen').classList.remove('on');
  document.getElementById('tttView').classList.add('on');
  startTTT();
});
function startTTT(){
  tttBoard=['','','','','','','','',''];tttActive=true;
  tttStatus.textContent='Твой ход — ты ❌';
  tttGrid.innerHTML='';
  for(let i=0;i<9;i++){
    const c=document.createElement('button');
    c.className='ttt-cell';c.dataset.idx=i;
    c.addEventListener('click',()=>tttMove(i,c));
    tttGrid.appendChild(c);
  }
}
function tttMove(idx,cell){
  if(!tttActive||tttBoard[idx])return;
  tttBoard[idx]='X';cell.textContent='✕';cell.classList.add('x');
  note(700,0,.1,'sine',.15);
  if(checkTTT('X')){tttEnd('win');return;}
  if(tttBoard.every(x=>x)){tttEnd('draw');return;}
  tttActive=false;tttStatus.textContent='🤖 Ход...';
  setTimeout(()=>{aiMove();tttActive=true;},500);
}
function aiMove(){
  let move=-1;
  for(let i=0;i<9;i++){if(!tttBoard[i]){tttBoard[i]='O';if(checkTTT('O')){move=i;break;}tttBoard[i]='';}}
  if(move===-1)for(let i=0;i<9;i++){if(!tttBoard[i]){tttBoard[i]='X';if(checkTTT('X')){move=i;tttBoard[i]='';break;}tttBoard[i]='';}}
  if(move===-1&&!tttBoard[4])move=4;
  if(move===-1){const c=[0,2,6,8].filter(i=>!tttBoard[i]);if(c.length)move=c[Math.floor(Math.random()*c.length)];}
  if(move===-1){const f=tttBoard.map((x,i)=>!x?i:-1).filter(i=>i>=0);if(f.length)move=f[Math.floor(Math.random()*f.length)];}
  if(move>=0){
    tttBoard[move]='O';
    const c=tttGrid.children[move];
    c.textContent='◯';c.classList.add('o');
    note(400,0,.15,'sine',.15);
    if(checkTTT('O')){tttEnd('lose');return;}
    if(tttBoard.every(x=>x)){tttEnd('draw');return;}
    tttStatus.textContent='Твой ход — ты ❌';
  }
}
function checkTTT(p){
  const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  for(const l of L)if(tttBoard[l[0]]===p&&tttBoard[l[1]]===p&&tttBoard[l[2]]===p){l.forEach(i=>tttGrid.children[i].classList.add('win'));return true;}
  return false;
}
function tttEnd(r){
  tttActive=false;
  if(r==='win'){
    tttStatus.innerHTML='<span style="color:#4ade80;text-shadow:0 0 20px #4ade80;">🏆 ТЫ ВЫИГРАЛ!</span>';
    note(1046,0,.15,'sine',.18);note(1318,.12,.15,'sine',.18);note(1568,.24,.3,'sine',.18);
    setTimeout(()=>showFinal('🏆','Победа!','Ты обыграл компьютер! 💜'),1200);
  }else if(r==='lose'){
    tttStatus.innerHTML='<span style="color:#ff5c8a;">😤 Компьютер выиграл</span>';
    note(200,0,.3,'sawtooth',.15);setTimeout(startTTT,1500);
  }else{
    tttStatus.innerHTML='<span style="color:#ffd93d;">🤝 Ничья!</span>';setTimeout(startTTT,1500);
  }
}
